<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Khoj — Search the web</title>
  <link rel="icon" href="../../assets/aman-mark.svg" type="image/svg+xml">
  <style>
    :root { --blue:#4285f4; --text:#202124; --muted:#5f6368; --line:#dfe1e5; }
    * { box-sizing:border-box } body { margin:0; color:var(--text); font:14px Arial,sans-serif; background:#fff; }
    header { height:72px; display:flex; align-items:center; justify-content:flex-end; padding:0 30px; gap:22px; }
    header a { color:#202124; text-decoration:none; font-size:13px } .avatar { background:#173e80;color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:bold }
    main { min-height:calc(100vh - 72px); padding:80px 20px 150px; text-align:center; }
    .brand { font-size:86px; font-weight:700; letter-spacing:-6px; margin:0 0 28px; user-select:none; }
    .brand span:nth-child(1),.brand span:nth-child(4){color:#4285f4}.brand span:nth-child(2),.brand span:nth-child(6){color:#ea4335}.brand span:nth-child(3){color:#fbbc05}.brand span:nth-child(5){color:#34a853}
    .tag { color:var(--muted); margin:-19px 0 25px; font-size:13px; letter-spacing:2px; text-transform:uppercase; }
    form { max-width:584px; margin:auto; position:relative; } .search { width:100%; height:48px; border:1px solid var(--line); border-radius:24px; padding:0 48px; outline:0; font-size:16px; box-shadow:0 1px 3px #ddd5; }
    .search:hover,.search:focus { box-shadow:0 1px 6px #bbb; border-color:transparent } .glass { position:absolute; left:17px; top:14px; color:#9aa0a6; font-size:20px }.mic { position:absolute; right:17px;top:13px;border:0;background:transparent;font-size:18px;cursor:pointer }
    .buttons { margin-top:28px } button { border:1px solid #f8f9fa; border-radius:4px; background:#f8f9fa; color:#3c4043; padding:10px 17px; margin:0 3px; cursor:pointer; font-size:14px } button:hover { border-color:#dadce0; box-shadow:0 1px 1px #ddd }
    #results { display:none; max-width:690px; margin:42px auto 0; text-align:left; } .count { color:var(--muted); font-size:13px; margin:0 0 22px }.result { margin:0 0 28px }.url { font-size:12px;color:#202124;margin-bottom:4px }.title { color:#1a0dab; font-size:20px; line-height:1.3; text-decoration:none; cursor:pointer }.title:hover{text-decoration:underline}.snippet { color:#4d5156; line-height:1.58;margin:4px 0 0; }.empty { color:var(--muted); font-size:16px; line-height:1.7 }
    footer { position:fixed;bottom:0;width:100%;background:#f2f2f2;color:#70757a;padding:14px 30px;border-top:1px solid #dadce0 } @media(max-width:600px){.brand{font-size:62px}.brand{letter-spacing:-5px}main{padding-top:48px}header{padding:0 18px}.tag{font-size:11px}}
  </style>
</head>
<body>
  <header><a href="#about" onclick="showAbout()">About</a><a href="#how" onclick="showAbout()">How it works</a><div class="avatar">K</div></header>
  <main>
    <h1 class="brand" aria-label="Khoj"><span>K</span><span>h</span><span>o</span><span>j</span><span>़</span></h1>
    <p class="tag">Search. Discover. Know.</p>
    <form id="searchForm"><span class="glass">⌕</span><input id="query" class="search" autocomplete="off" autofocus aria-label="Search" placeholder="Khoj mein search karein"><button class="mic" title="Voice search" type="button" onclick="voiceSearch()">🎙</button></form>
    <div class="buttons"><button onclick="performSearch()">Khoj Search</button><button onclick="lucky()">I’m Feeling Lucky</button></div>
    <section id="results" aria-live="polite"></section>
  </main>
  <footer>India &nbsp;•&nbsp; Privacy &nbsp;•&nbsp; Terms</footer>
  <script>
    // This local seed index demonstrates search + ranking. A production service replaces it with a crawler and database.
    const pages = [
      {title:'India’s official government portal', url:'https://www.india.gov.in/', text:'Government of India services, citizen information, documents, schemes and official updates.', tags:'india government services portal schemes'},
      {title:'Wikipedia — The free encyclopedia', url:'https://en.wikipedia.org/', text:'A collaborative encyclopedia with articles on history, science, technology, people, places and culture.', tags:'wikipedia knowledge encyclopedia history science'},
      {title:'OpenAI', url:'https://openai.com/', text:'AI research and products that help people solve problems, learn and create.', tags:'openai artificial intelligence chatgpt technology'},
      {title:'World news and analysis', url:'https://www.bbc.com/news', text:'Latest reporting, explainers and analysis from around the world.', tags:'news breaking world india politics sports'},
      {title:'Learn web development', url:'https://developer.mozilla.org/', text:'Guides and references for HTML, CSS, JavaScript and modern web development.', tags:'learn coding html css javascript web development'},
      {title:'YouTube', url:'https://www.youtube.com/', text:'Watch videos, music, tutorials, news and entertainment from creators worldwide.', tags:'video music tutorials entertainment youtube'},
      {title:'Google Maps', url:'https://maps.google.com/', text:'Find directions, local places, restaurants and businesses on an interactive map.', tags:'maps directions location restaurants travel'},
      {title:'Khan Academy', url:'https://www.khanacademy.org/', text:'Free education in maths, science, computing, economics and more.', tags:'education learn math science courses school'}
    ];
    const $ = s => document.querySelector(s);
    $('#searchForm').addEventListener('submit', e => { e.preventDefault(); performSearch(); });
    $('#query').addEventListener('input', () => { if (!$('#query').value.trim()) $('#results').style.display='none'; });
    function score(p, words) { const hay=(p.title+' '+p.tags+' '+p.text).toLowerCase(); return words.reduce((n,w)=>n+(p.title.toLowerCase().includes(w)?8:0)+(p.tags.toLowerCase().includes(w)?4:0)+(hay.split(w).length-1),0); }
    function performSearch(){ const q=$('#query').value.trim(); if(!q) return; const words=q.toLowerCase().split(/\s+/); const found=pages.map(p=>({p,s:score(p,words)})).filter(x=>x.s).sort((a,b)=>b.s-a.s); const box=$('#results'); box.style.display='block';
      if(!found.length){box.innerHTML=`<p class="empty">“${escapeHtml(q)}” ke liye local index mein koi result nahi mila.<br>Production version mein crawler poore web se naye pages index karega.</p>`; return;}
      box.innerHTML=`<p class="count">About ${found.length} results for <b>${escapeHtml(q)}</b></p>`+found.map(({p})=>`<article class="result"><div class="url">${p.url.replace(/^https?:\/\//,'')}</div><a class="title" href="${p.url}" target="_blank" rel="noopener">${p.title}</a><p class="snippet">${highlight(p.text,q)}</p></article>`).join('');
    }
    function lucky(){ const q=$('#query').value.trim(); if(!q){$('#query').value='web development';} performSearch(); const first=$('.title'); if(first) setTimeout(()=>first.click(),150); }
    function highlight(text,q){return escapeHtml(text).replace(new RegExp('('+q.trim().split(/\s+/).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig'),'<b>$1</b>')}
    function escapeHtml(t){return t.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function voiceSearch(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert('Voice search is not supported in this browser.');return;} const r=new SR();r.lang='hi-IN';r.onresult=e=>{$('#query').value=e.results[0][0].transcript;performSearch()};r.start();}
    function showAbout(){ $('#results').style.display='block'; $('#results').innerHTML='<p class="empty"><b>Khoj MVP</b><br>Yeh aapke search engine ka frontend prototype hai. Agla step: crawler service, searchable database, ranking system aur deployed API.</p>'; }
  </script>
</body>
</html>
